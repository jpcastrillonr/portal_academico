<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Portal académico</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section id="login">
      <h2>Portal académico</h2>
      <p>Institución Educativa - Inicia sesión para continuar.</p>

      <form>
        <fieldset>
          <legend>Datos de acceso</legend>
          <div class="campo">
            <label for="correo">Correo institucional</label>
            <input type="email" id="correo" placeholder="nombre@institucion.edu.co" required>
          </div>
          <div class="campo">
            <label for="clave">Contraseña</label>
            <input type="password" id="clave" required>
          </div>
        </fieldset>

         
        <div class="botones">
          <button type="submit" formaction="estudiante-notas.html">Entrar como estudiante</button>
          <button type="submit" formaction="profesor-asistencia.html" class="secundario">Entrar como profesor</button>
        </div>
      </form>

      
    </section>
  </main>
</body>
</html>
